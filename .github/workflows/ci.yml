name: Attow Network CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Rust 1.95.0 / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out sources
        # actions/checkout v7.0.1; provenance: docs/research/ci-pins.json
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the exact side-by-side toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Verify the native compiler host
        shell: bash
        env:
          EXPECTED_HOST: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustc +1.95.0 --version --verbose
          actual_host="$(rustc +1.95.0 --version --verbose | sed -n 's/^host: //p' | tr -d '\r')"
          test "$actual_host" = "$EXPECTED_HOST"
      - name: Repository and default checks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Repository and default checks (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/check.sh
      - name: Check the minimal facade
        shell: bash
        run: cargo +1.95.0 check --package attow-network --no-default-features --locked
      - name: Test the sandbox feature and durable process resume
        shell: bash
        run: cargo +1.95.0 test --workspace --all-targets --features sandbox --locked
      - name: Lint the sandbox feature
        shell: bash
        run: cargo +1.95.0 clippy --workspace --all-targets --features sandbox --locked -- -D warnings
      - name: Test scheduling, reuse, and exact offline replay
        shell: bash
        run: cargo +1.95.0 test --workspace --all-targets --features scheduler --locked
      - name: Lint the scheduler feature
        shell: bash
        run: cargo +1.95.0 clippy --workspace --all-targets --features scheduler --locked -- -D warnings

  owned-browser:
    name: Owned Chromium fixture / Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      CARGO_BUILD_JOBS: "2"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out sources
        # Same verified checkout commit as the native Rust lane.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the exact side-by-side Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy
      - name: Verify the native compiler host
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = rustc +1.95.0 --version --verbose
          if ($LASTEXITCODE -ne 0) { throw 'rustc failed' }
          $compiler
          if ($compiler -notcontains 'host: x86_64-pc-windows-msvc') { throw 'Unexpected compiler host' }
      - name: Install the verified local Node archive
        # Official archive and SHA256 provenance: docs/research/stage7-browser-provenance.json
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'attow-node-v24.21.0-win-x64.zip'
          $runtime = Join-Path $env:RUNNER_TEMP 'attow-node-runtime'
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v24.21.0/node-v24.21.0-win-x64.zip' -OutFile $archive
          $expected = '158f7685b44de51f6c0df1d153526cbcd3e1bc739a8dfc607721cef75de9e541'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Node archive checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime
          $nodeDirectory = Join-Path $runtime 'node-v24.21.0-win-x64'
          $nodeExecutable = Join-Path $nodeDirectory 'node.exe'
          if ((& $nodeExecutable --version) -ne 'v24.21.0') { throw 'Node version mismatch' }
          $nodeDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "ATTOW_NODE=$nodeExecutable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PLAYWRIGHT_BROWSERS_PATH=$env:GITHUB_WORKSPACE/demos/workflow-studio/browser/.browsers" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install the locked sidecar dependencies
        run: npm ci --ignore-scripts --prefix demos/workflow-studio/browser
      - name: Install the pinned Chromium locally
        # Invoke the installed CLI directly; never resolve an uninstalled package through npx.
        run: node demos/workflow-studio/browser/node_modules/playwright/cli.js install chromium
      - name: Test SQL and durable provider adapters
        run: cargo +1.95.0 test --workspace --all-targets --features adapters --locked
      - name: Test the real browser storage and containment contract
        run: cargo +1.95.0 test --package attow-adapters --all-targets --features browser --locked
      - name: Test branch promotion and provider reconciliation
        run: cargo +1.95.0 test --test adapter_conformance --features browser --locked
      - name: Test receipt replacement and dependent reruns
        run: cargo +1.95.0 test --test adapter_receipt --features browser,scheduler --locked
      - name: Lint the implemented browser and scheduler composition
        run: cargo +1.95.0 clippy --workspace --all-targets --features browser,scheduler --locked -- -D warnings

# Add other runtime feature lanes as their implementations land.
# Installation downloads are separate from owned-loopback runtime tests.
# This workflow neither publishes artifacts nor contacts real effect providers.
