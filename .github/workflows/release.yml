name: Attow Network unsigned candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'sharb1235-hash/attow-network' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2025
    timeout-minutes: 360
    # Owner must configure required reviewers/protection; YAML alone does not do so.
    environment: release-candidate
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_BACKTRACE: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the selected immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify source and install exact Rust
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Source revision mismatch' }
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain provisioning failed' }
          $compiler = rustc +1.95.0 --version --verbose
          if ($LASTEXITCODE -ne 0 -or $compiler -notcontains 'host: x86_64-pc-windows-msvc') { throw 'Native compiler mismatch' }
          $compiler
      - name: Provision verified browser prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'node-v24.21.0-win-x64.zip'
          $runtime = Join-Path $env:RUNNER_TEMP 'attow-node'
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v24.21.0/node-v24.21.0-win-x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '158f7685b44de51f6c0df1d153526cbcd3e1bc739a8dfc607721cef75de9e541') { throw 'Node integrity mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime
          $directory = Join-Path $runtime 'node-v24.21.0-win-x64'
          $node = Join-Path $directory 'node.exe'
          if ((& $node --version) -ne 'v24.21.0') { throw 'Node version mismatch' }
          $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "ATTOW_NODE=$node" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ATTOW_BROWSER_SIDECAR=$env:GITHUB_WORKSPACE/demos/workflow-studio/browser/sidecar.mjs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PLAYWRIGHT_BROWSERS_PATH=$env:GITHUB_WORKSPACE/demos/workflow-studio/browser/.browsers" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install locked sidecar and Chromium
        run: |
          npm ci --ignore-scripts --prefix demos/workflow-studio/browser
          if ($LASTEXITCODE -ne 0) { throw 'Locked npm installation failed' }
          & $env:ATTOW_NODE demos/workflow-studio/browser/node_modules/playwright/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed' }
      - name: Provision verified dependency policy checker
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'cargo-deny-0.20.2.tar.gz'
          $directory = Join-Path $env:RUNNER_TEMP 'attow-deny'
          New-Item -ItemType Directory -Path $directory | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-pc-windows-msvc.tar.gz' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '975a22143262fd27476d19ee00c7af67978426e40e1dee94eed6bbade1cf87dc') { throw 'Policy archive integrity mismatch' }
          tar -xzf $archive -C $directory
          if ($LASTEXITCODE -ne 0) { throw 'Policy tool extraction failed' }
          $tool = Join-Path $directory 'cargo-deny-0.20.2-x86_64-pc-windows-msvc/cargo-deny.exe'
          if ((Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f7292fab58c706638c999e64c4ba82e5128ae628130ba55e3266a768ee431fbf') { throw 'Policy executable integrity mismatch' }
          if ((& $tool --version) -ne 'cargo-deny 0.20.2') { throw 'Policy version mismatch' }
          "ATTOW_CARGO_DENY=$tool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $tool fetch db
          if ($LASTEXITCODE -ne 0) { throw 'Advisory database fetch failed' }
          cargo +1.95.0 fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'Registry cache provisioning failed' }
      - name: Plan the native candidate
        run: cargo +1.95.0 run -p xtask --locked -- release-plan
      - name: Run and bind every local release gate
        run: cargo +1.95.0 run -p xtask --locked -- release-check --local
      - name: Build, install and record the actual candidate
        run: cargo +1.95.0 run -p xtask --locked -- release-build --target x86_64-pc-windows-msvc --output release-candidate
      - name: Verify unsigned integrity
        run: cargo +1.95.0 run -p xtask --locked -- release-verify --dir release-candidate --integrity-only
      - name: Retain the unsigned candidate and its evidence
        # actions/upload-artifact v7.0.2; docs/research/stage10-actions.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: attow-network-0.1.0-windows-unsigned-${{ github.sha }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 14

# No release publication, registry push, tag, signing credentials or OIDC token.
# Authentic signing remains a separate explicitly configured maintainer operation.
